[workspace]
resolver = "2"
members = ["core", "cli", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
strsim = "0.11"
anyhow = "1"
thiserror = "2"
once_cell = "1"
